[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "justfastllm"
version = "0.1.0"
description = "A minimal-memory, provider-agnostic LLM gateway server using direct HTTP APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Suhas Bhairav", email = "hello@suhasbhairav.com" }
]
keywords = ["llm", "gateway", "proxy", "openai", "anthropic", "deepseek", "grok", "qwen", "kimi", "ollama", "redis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "pymongo>=4.6",
  "pymssql>=2.3",
  "PyMySQL>=1.1",
  "psycopg[binary]>=3.1",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
speedups = [
  "uvicorn[standard]>=0.30",
  "orjson>=3.10",
]

[project.scripts]
justfastllm = "justfastllm.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/justfastllm"]
