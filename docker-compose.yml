services:
  justfastllm:
    build: .
    image: justfastllm:local
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      JUSTFASTLLM_HOST: 0.0.0.0
      JUSTFASTLLM_PORT: 8000
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
